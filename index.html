<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Cards</title>
    <style>
      :root {
        font-family: Arial, sans-serif;
        background-color: #f4f6fb;
        color: #222;
      }

      body {
        margin: 0;
        padding: 20px;
      }

      .pricing-grid {
        display: grid;
        gap: 20px;
        max-width: 1200px;
        margin: 0 auto;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }

      .pricing-card {
        background-color: #ffffff;
        border-radius: 16px;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
        padding: 24px;
        display: flex;
        flex-direction: column;
        min-height: 320px;
      }

      .card-title {
        margin: 0 0 12px;
        font-size: 24px;
        font-weight: 700;
      }

      .card-price {
        margin: 0 0 18px;
        font-size: 30px;
        color: #1b7f56;
      }

      .card-features {
        list-style: none;
        padding: 0;
        margin: 0 0 24px;
        flex-grow: 1;
      }

      .card-features li {
        padding: 10px 0;
        border-bottom: 1px solid #eef1f6;
      }

      .card-features li:last-child {
        border-bottom: none;
      }

      .card-button {
        background-color: #2563eb;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 14px 18px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.2s ease;
      }

      .card-button:hover {
        background-color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="pricing-grid">
      <div class="pricing-card">
        <h2 class="card-title">Basic Plan</h2>
        <p class="card-price">$9.99 / month</p>
        <ul class="card-features">
          <li>1 GB Storage</li>
          <li>Basic Support</li>
          <li>All Core Features</li>
        </ul>
        <button class="card-button">Start Trial</button>
      </div>

      <div class="pricing-card">
        <h2 class="card-title">Pro Plan</h2>
        <p class="card-price">$19.99 / month</p>
        <ul class="card-features">
          <li>10 GB Storage</li>
          <li>Priority Support</li>
          <li>Advanced Analytics</li>
        </ul>
        <button class="card-button">Start Trial</button>
      </div>

      <div class="pricing-card">
        <h2 class="card-title">Enterprise Plan</h2>
        <p class="card-price">$49.99 / month</p>
        <ul class="card-features">
          <li>Unlimited Storage</li>
          <li>Dedicated Support</li>
          <li>Custom Integrations</li>
        </ul>
        <button class="card-button">Start Trial</button>
      </div>
    </div>
  </body>
</html>
